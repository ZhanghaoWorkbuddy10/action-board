    for(var i=0;i<row.length;i++){var fv=(f[i]||'');if(fv&&String(row[i]).trim()!==fv){show=false;break;}}
    if(!show)continue;n++;
    out+='<tr>'+row.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';
  }
  tb.innerHTML=out;
  document.getElementById('cnt-'+g).textContent='显示 '+n+' / 总 '+data.length+' 条';
}
function showTab(g){
  ['confirm','arrange','ndt'].forEach(function(x){
    document.getElementById('tab-'+x).style.display=(x===g)?'block':'none';
  });
  document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('btn-'+g).classList.add('active');
  render(g);
}
document.querySelectorAll('.colf').forEach(function(inp){
  inp.addEventListener('change',function(){var g=inp.dataset.g;var i=parseInt(inp.dataset.i);filters[g][i]=inp.value;render(g);});
});
showTab('confirm');render('arrange');render('ndt');
</script></body></html>
