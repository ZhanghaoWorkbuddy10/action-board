  var tbody = document.getElementById(tbodyId);
  tbody.innerHTML = data.map(function(r, i) {
    return '<tr>' +

      '<td>' + getCatBadge(r.cat) + '</td>' +

var sortState = {};
function sortTable(tableId, colIdx) {
  var table = document.getElementById(tableId);
  var tbody = table.querySelector('tbody');
  var rows = Array.from(tbody.querySelectorAll('tr'));
  var key = tableId + '_' + colIdx;
  sortState[key] = sortState[key] === 'asc' ? 'desc' : 'asc';
  var dir = sortState[key] === 'asc' ? 1 : -1;
  rows.sort(function(a, b) {
    var aVal = a.cells[colIdx].textContent.trim();
    var bVal = b.cells[colIdx].textContent.trim();
    return aVal.localeCompare(bVal, 'zh-CN') * dir;
  });
  rows.forEach(function(r) { tbody.appendChild(r); });
  table.querySelectorAll('th').forEach(function(th) { th.classList.remove('sorted'); });
  table.querySelectorAll('th')[colIdx].classList.add('sorted');
}
