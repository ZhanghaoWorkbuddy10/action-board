function getApproverTag(approver) {
  if (!approver) return '<span class="tag empty">未分配</span>';
  if (approver.includes('流程') || approver.includes('返工')) return '<span class="tag flow">' + approver + '</span>';
  return '<span class="tag person">' + approver + '</span>';
}

function getCatBadge(cat) {
  var display = ({'高精高速':'高精高速组件','子件':'高精高速子件'})[cat] || (cat || '其他');
  if (cat === '高精高速') return '<span class="cat-tag gaojing">' + display + '</span>';
  if (cat === '子件') return '<span class="cat-tag zijian">' + display + '</span>';
  return '<span class="cat-tag other">' + display + '</span>';
}

function renderTable(tbodyId, data) {
  var tbody = document.getElementById(tbodyId);
  tbody.innerHTML = data.map(function(r, i) {
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td>' + getCatBadge(r.cat) + '</td>' +
      '<td>' + r.bianma + '</td>' +
      '<td class="name">' + r.name + '</td>' +
      '<td>' + r.kehu + '</td>' +
      '<td class="ncr"><a href="' + r.link + '" target="_blank" title="打开OA">' + r.ncr + '</a></td>' +
      '<td>' + getApproverTag(r.approver) + '</td>' +
      '<td class="hide-mobile">' + r.time + '</td>' +
      '</tr>';
  }).join('');
}

renderTable('tbodyAll', DATA);

var sortState = {};
function sortTable(tableId, colIdx) {
  var table = document.getElementById(tableId);
  var tbody = table.querySelector('tbody');
  var rows = Array.from(tbody.querySelectorAll('tr'));
  var key = tableId + '_' + colIdx;
  sortState[key] = sortState[key] === 'asc' ? 'desc' : 'asc';
  var dir = sortState[key] === 'asc' ? 1 : -1;
  rows.sort(function(a, b) {
    var aVal = a.cells[colIdx].textContent.trim();
    var bVal = b.cells[colIdx].textContent.trim();
    return aVal.localeCompare(bVal, 'zh-CN') * dir;
  });
  rows.forEach(function(r) { tbody.appendChild(r); });
  table.querySelectorAll('th').forEach(function(th) { th.classList.remove('sorted'); });
  table.querySelectorAll('th')[colIdx].classList.add('sorted');
}
