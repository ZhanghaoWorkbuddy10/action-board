  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${esc(m.name)}</td><td class="num">${m['本月']}</td><td class="num">${m['本周']}</td><td class="num">${m['当前']}</td>`;
  sumBody.appendChild(tr);
});

// nav
const modByName = {};
DATA.modules.forEach(m => modByName[m.name]=m);
let items = [{key:'overview', label:'总览'}].concat(DATA.modules.map(m=>({key:m.name, label:m.name})));
items.forEach(it => {
  const b = document.createElement('button');
  b.textContent = it.label; b.dataset.key = it.key;
  b.onclick = () => show(it.key);
  nav.appendChild(b);
});

let curCols=[], curBase=[], curDistinct=[], curRows=[], sortIdx=-1, sortAsc=true;
let filters = {};  // colIdx -> Set(allowed display values), absent or size 0 = 全部

function getDistinct(colIdx){
  const set = new Set();
  curBase.forEach(r => set.add(r[colIdx]==='' ? EMPTY : String(r[colIdx])));
  return Array.from(set).sort((a,b)=>String(a).localeCompare(String(b),'zh'));
}

function computeRows(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  curRows = curBase.filter(r => {
    if(q && !r.join(' ').toLowerCase().includes(q)) return false;
    for(const ci in filters){
      const allow = filters[ci];
      if(allow && allow.size > 0){
        const v = r[ci]==='' ? EMPTY : String(r[ci]);
        if(!allow.has(v)) return false;
      }
    }
    return true;
  });
}

function renderTable(){
  const t = document.getElementById('modTable');
  t.innerHTML='';
  const thead = document.createElement('thead'); const hr=document.createElement('tr');
  curCols.forEach((c,i)=>{
    const th=document.createElement('th');
    const span=document.createElement('span'); span.className='hlabel'; span.textContent=c;
    span.onclick=()=>{ if(sortIdx===i){sortAsc=!sortAsc;}else{sortIdx=i;sortAsc=true;} sortRows(); renderTable(); };
    const ico=document.createElement('span'); ico.className='filter-ico'; ico.textContent='▾'; ico.title='筛选';
    ico.onclick=(e)=>{ e.stopPropagation(); openFilter(i, th); };
    const inner=document.createElement('span'); inner.className='th-in'; inner.appendChild(span); inner.appendChild(ico);
    th.appendChild(inner);
    if(filters[i] && filters[i].size>0 && filters[i].size < curDistinct[i].length) th.classList.add('filtered');
    hr.appendChild(th);
  });
  thead.appendChild(hr); t.appendChild(thead);
  const tb=document.createElement('tbody');
  curRows.forEach(r=>{ const tr=document.createElement('tr');
    curCols.forEach((c,i)=>{ const td=document.createElement('td'); td.textContent=r[i]; if(!isNaN(r[i])&&r[i]!=='') td.className='num'; tr.appendChild(td); });
    tb.appendChild(tr); });
  t.appendChild(tb);
  document.getElementById('cnt').textContent = `共 ${curRows.length} 行` + (curRows.length!==curBase.length ? `（已筛选，总 ${curBase.length}）` : '');
  renderFilterBar();
}

function renderFilterBar(){
  filterBar.innerHTML='';
  const active = Object.keys(filters).filter(ci => filters[ci] && filters[ci].size>0 && filters[ci].size < curDistinct[ci].length);
  if(active.length===0) return;
  const lab=document.createElement('span'); lab.textContent='筛选：'; filterBar.appendChild(lab);
  active.forEach(ci=>{
    const colName = curCols[ci];
    const vals = Array.from(filters[ci]);
    const disp = vals.map(v=>v===EMPTY?'(空)':v).join('、');
    const chip=document.createElement('span'); chip.className='chip';
    chip.innerHTML = `<b>${esc(colName)}</b>: ${esc(disp)} <span class="x" data-ci="${ci}">✕</span>`;
    chip.querySelector('.x').onclick=()=>{ delete filters[ci]; computeRows(); renderTable(); };
    filterBar.appendChild(chip);
  });
  const clearAll=document.createElement('span'); clearAll.className='clear-all'; clearAll.textContent='清除全部';
  clearAll.onclick=()=>{ filters={}; computeRows(); renderTable(); };
  filterBar.appendChild(clearAll);
}

function sortRows(){
  curRows.sort((a,b)=>{ const x=a[sortIdx], y=b[sortIdx];
    const nx=parseFloat(x), ny=parseFloat(y);
    if(!isNaN(nx)&&!isNaN(ny)) return sortAsc?nx-ny:ny-nx;
    return sortAsc? String(x).localeCompare(String(y),'zh') : String(y).localeCompare(String(x),'zh'); });
}

function openFilter(colIdx, th){
  closeFilter();
  const vals = getDistinct(colIdx);
  const sel = filters[colIdx] ? new Set(filters[colIdx]) : new Set(vals);
  const pop=document.createElement('div'); pop.className='filter-pop'; pop.id='filterPop';
  let html = `<div class="fp-head"><input class="fp-search" placeholder="搜索值…"><span class="fp-count"></span></div>`;
  html += `<div class="fp-actions"><label><input type="checkbox" class="fp-all"> 全选</label><button class="fp-clear">清空</button></div>`;
  html += `<div class="fp-list"></div>`;
  html += `<div class="fp-foot"><button class="fp-ok btn sm">完成</button></div>`;
  pop.innerHTML=html;
  document.body.appendChild(pop);
  const rect=th.getBoundingClientRect();
  const wrapRect=document.querySelector('.tbl-wrap').getBoundingClientRect();
  pop.style.top=(window.scrollY + rect.bottom + 4)+'px';
  let left = window.scrollX + rect.left;
  if(left + 240 > window.scrollX + window.innerWidth) left = window.scrollX + window.innerWidth - 250;
  pop.style.left = left+'px';
  const listEl=pop.querySelector('.fp-list');
  const allCb=pop.querySelector('.fp-all');
  function renderList(){
    const q=pop.querySelector('.fp-search').value.trim().toLowerCase();
    let h='';
    vals.forEach(v=>{
      const disp = v===EMPTY ? '(空)' : v;
      if(q && !String(disp).toLowerCase().includes(q)) return;
      const checked = sel.has(v) ? 'checked' : '';
      h += `<label class="fp-item"><input type="checkbox" value="${esc(v)}" ${checked}> <span>${esc(disp)}</span></label>`;
    });
    listEl.innerHTML=h;
    pop.querySelector('.fp-count').textContent = sel.size+'/'+vals.length;
    allCb.checked = (sel.size===vals.length);
    listEl.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.onchange=()=>{ if(cb.checked) sel.add(cb.value); else sel.delete(cb.value); applyLive(); };
    });
  }
  function applyLive(){
    filters[colIdx] = new Set(sel);
    computeRows(); renderTable();
  }
  pop.querySelector('.fp-search').addEventListener('input', renderList);
  allCb.addEventListener('change', e=>{
    if(e.target.checked){ vals.forEach(v=>sel.add(v)); } else { sel.clear(); }
    renderList(); applyLive();
  });
  pop.querySelector('.fp-clear').addEventListener('click', ()=>{ sel.clear(); renderList(); applyLive(); });
  pop.querySelector('.fp-ok').addEventListener('click', closeFilter);
  renderList();
  setTimeout(()=>{ document.addEventListener('click', outsideClose); }, 0);
  function outsideClose(ev){ if(!pop.contains(ev.target)) closeFilter(); }
  pop._outside = outsideClose;
}
function closeFilter(){
  const p=document.getElementById('filterPop');
  if(p){ if(p._outside) document.removeEventListener('click', p._outside); p.remove(); }
}

document.getElementById('search').addEventListener('input', e=>{ computeRows(); renderTable(); });

function exportExcel(){
  const name = pageTitle.textContent;
  const m = modByName[name];
  if(!m){ return; }
  if(typeof XLSX === 'undefined'){ alert('导出组件未加载，请联网后重试'); return; }
  const rowsForExport = curRows.map(r => {
    const out = r.slice();
    // 把空送占位还原为原生空（导出更干净）
    return out;
  });
  const aoa = [m.cols].concat(rowsForExport.map(r => r.map(v => {
    const n = parseFloat(v);
    return (!isNaN(n) && v !== '' && v !== null) ? n : v;
  })));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  XLSX.writeFile(wb, name + '.xlsx');
}
document.getElementById('exportBtn').onclick = exportExcel;
document.getElementById('printBtn').onclick = function(){ window.print(); };

// 待加工趋势折线图（四个模块分别展示，折点显示数值）
const TREND_META = [
  {key:'入库', name:'入库', color:'#4dabf7'},
  {key:'探伤', name:'探伤', color:'#ff922b'},
  {key:'动平衡', name:'动平衡', color:'#51cf66'},
  {key:'磨齿', name:'磨齿', color:'#cc5de8'},
];
function drawOneTrend(t, arr){
  const W=420,H=260,m={l:46,r:16,t:22,b:46};
  const pw=W-m.l-m.r, ph=H-m.t-m.b;
  let maxY=0;
  arr.forEach(d=>{ const v=+d[t.key]||0; if(v>maxY)maxY=v; });
  const niceMax = Math.max(20, Math.ceil(maxY/20)*20);
  const n=arr.length;
  const X = i => n<=1 ? m.l+pw/2 : m.l + pw*i/(n-1);
  const Y = v => m.t + ph*(1 - v/niceMax);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system,'Microsoft YaHei',sans-serif">`;
  const steps=4;
  for(let s=0;s<=steps;s++){
    const val=niceMax*s/steps, yy=Y(val);
    svg+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="#eef1f5"/>`;
    svg+=`<text x="${m.l-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#8a97a8">${Math.round(val)}</text>`;
  }
  svg+=`<line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ph}" stroke="#cfd8e3"/>`;
  svg+=`<line x1="${m.l}" y1="${m.t+ph}" x2="${W-m.r}" y2="${m.t+ph}" stroke="#cfd8e3"/>`;
  arr.forEach((d,i)=>{
    svg+=`<text x="${X(i)}" y="${m.t+ph+18}" text-anchor="middle" font-size="11" fill="#5a6b7e">${esc(d.label)}</text>`;
  });
  const pts = arr.map((d,i)=>`${X(i)},${Y(+d[t.key]||0)}`).join(' ');
  svg+=`<polyline points="${pts}" fill="none" stroke="${t.color}" stroke-width="2.5"/>`;
  arr.forEach((d,i)=>{
    const v=+d[t.key]||0, cx=X(i), cy=Y(v);
    const showAbove = (cy - 14) > m.t;
    const ty = showAbove ? cy-9 : cy+16;
    svg+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="${t.color}"/>`;
    svg+=`<text class="pt-val" x="${cx}" y="${ty}" text-anchor="middle" fill="${t.color}">${v}</text>`;
  });
  svg+=`</svg>`;
  return `<div class="trend-card"><h4><i style="background:${t.color}"></i>${t.name}</h4>${svg}</div>`;
}
function drawTrend(){
  const grid = document.getElementById('trendGrid');
  const arr = DATA.trend || [];
  if(!arr.length){ grid.innerHTML='<p class="sub">暂无趋势数据</p>'; return; }
  grid.innerHTML = TREND_META.map(t=>drawOneTrend(t, arr)).join('');
}
drawTrend();

function show(key){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  if(key==='overview'){ overview.classList.add('active'); moduleP.classList.remove('active'); pageTitle.textContent='总览'; return; }
  overview.classList.remove('active'); moduleP.classList.add('active');
  const m = modByName[key]; pageTitle.textContent = m.name;
  curCols = m.cols; curBase = m.rows.slice();
  curDistinct = curCols.map((c,i)=>getDistinct(i));
  filters = {}; sortIdx=-1; document.getElementById('search').value='';
  computeRows(); renderTable();
}

show('overview');
